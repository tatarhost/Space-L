name: Build Space L installable APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-space-l:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Apktool and original APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app tools build dist
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
            --output tools/apktool.jar
          curl --fail --location --retry 3 \
            https://github.com/tatarhost/Space-L/releases/download/apk/Spaceflight.Simulator.apk \
            --output app/input.apk
          echo "f2cc5e11d0906b2338c8d3a4912f017b8ac0b876f66a87d547ac8c33f3a1981c  app/input.apk" | sha256sum --check
          java -jar tools/apktool.jar d -f app/input.apk -o build/decoded

      - name: Inspect APK and inject Space L UI hook
        run: |
          set -euo pipefail
          python3 scripts/inspect_apk.py --apk app/input.apk --decoded build/decoded --report build/APK_Analysis_Report.md
          python3 scripts/patch.py --decoded build/decoded

      - name: Compile Space L UI to DEX
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          D8="$ANDROID_HOME/build-tools/35.0.0/d8"
          mkdir -p build/classes build/dex
          find app/src/main/java -name '*.java' -print0 | \
            xargs -0 javac --release 8 -classpath "$ANDROID_JAR" -d build/classes
          find build/classes -name '*.class' -print0 | \
            xargs -0 "$D8" --min-api 23 --lib "$ANDROID_JAR" --output build/dex
          test -s build/dex/classes.dex
          python3 -m py_compile scripts/patch.py scripts/inspect_apk.py

      - name: Rebuild APK and append Space L DEX
        run: |
          set -euo pipefail
          java -jar tools/apktool.jar b build/decoded -o build/SpaceL-rebuilt.apk
          python3 scripts/patch.py --apk build/SpaceL-rebuilt.apk \
            --dex build/dex/classes.dex --output-apk build/SpaceL-with-menu-unsigned.apk
          unzip -t build/SpaceL-with-menu-unsigned.apk
          unzip -l build/SpaceL-with-menu-unsigned.apk | grep -E 'classes[0-9]*\.dex'

      - name: Diagnose Android compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          echo "===== ORIGINAL APK ====="
          "$AAPT" dump badging app/input.apk | grep -E "^(package:|sdkVersion:|targetSdkVersion:|maxSdkVersion:|native-code:|uses-feature:)" || true
          echo "===== REBUILT APK ====="
          "$AAPT" dump badging build/SpaceL-rebuilt.apk | grep -E "^(package:|sdkVersion:|targetSdkVersion:|maxSdkVersion:|native-code:|uses-feature:)" || true
          "$AAPT" dump xmltree app/input.apk AndroidManifest.xml > build/original-manifest-tree.txt
          "$AAPT" dump xmltree build/SpaceL-rebuilt.apk AndroidManifest.xml > build/rebuilt-manifest-tree.txt
          diff -u build/original-manifest-tree.txt build/rebuilt-manifest-tree.txt > build/manifest-diff.txt || true
          echo "===== MANIFEST DIFF (first 300 lines) ====="
          sed -n '1,300p' build/manifest-diff.txt

      - name: Align and sign APK with temporary CI test key
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -noprompt \
            -keystore build/spaceL-ci-test.keystore \
            -storepass spaceL-ci-only -keypass spaceL-ci-only \
            -alias spaceL-test -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Space L CI Test, OU=Local Build, O=Space L, C=US"
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            build/SpaceL-with-menu-unsigned.apk build/SpaceL-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks build/spaceL-ci-test.keystore \
            --ks-key-alias spaceL-test \
            --ks-pass pass:spaceL-ci-only \
            --key-pass pass:spaceL-ci-only \
            --out dist/SpaceL_Mod.apk \
            build/SpaceL-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/SpaceL_Mod.apk
          sha256sum dist/SpaceL_Mod.apk > dist/SpaceL_Mod.apk.sha256

      - name: Package source patch and APK analysis
        run: |
          set -euo pipefail
          mkdir -p source-patch/app
          cp -R app/src source-patch/app/
          cp app/README.md source-patch/app/README.md
          cp -R scripts source-patch/
          find source-patch -type d -name __pycache__ -prune -exec rm -rf {} +
          cp README.md source-patch/
          cp build/dex/classes.dex source-patch/SpaceL_Menu.dex
          cp build/APK_Analysis_Report.md source-patch/
          cd source-patch
          zip -qr ../dist/SpaceL_Source_Patch.zip .

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceL-Installable-APK
          path: |
            dist/SpaceL_Mod.apk
            dist/SpaceL_Mod.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload source patch
        uses: actions/upload-artifact@v4
        with:
          name: SpaceL-Source-Patch
          path: dist/SpaceL_Source_Patch.zip
          if-no-files-found: error
          retention-days: 14
