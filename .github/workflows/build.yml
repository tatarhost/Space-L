name: Build Space L menu patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-menu-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT=/usr/local/lib/android/sdk
          if [ -n "$ANDROID_HOME" ]; then SDK_ROOT="$ANDROID_HOME"; fi
          test -d "$SDK_ROOT/cmdline-tools"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Apktool and original APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app tools build
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
            --output tools/apktool.jar
          curl --fail --location --retry 3 \
            https://github.com/tatarhost/Space-L/releases/download/apk/Spaceflight.Simulator.apk \
            --output app/input.apk
          echo "f2cc5e11d0906b2338c8d3a4912f017b8ac0b876f66a87d547ac8c33f3a1981c  app/input.apk" | sha256sum --check
          java -jar tools/apktool.jar d -f app/input.apk -o build/decoded

      - name: Inspect APK and validate Activity hook
        run: |
          set -euo pipefail
          python3 scripts/inspect_apk.py --apk app/input.apk --decoded build/decoded --report build/APK_Analysis_Report.md
          python3 scripts/patch.py --decoded build/decoded

      - name: Compile Space L UI to DEX
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          D8="$ANDROID_HOME/build-tools/35.0.0/d8"
          mkdir -p build/classes build/dex
          find app/src/main/java -name '*.java' -print0 | \
            xargs -0 javac --release 8 -classpath "$ANDROID_JAR" -d build/classes
          find build/classes -name '*.class' -print0 | \
            xargs -0 "$D8" --min-api 23 --lib "$ANDROID_JAR" --output build/dex
          test -s build/dex/classes.dex
          python3 -m py_compile scripts/patch.py scripts/inspect_apk.py

      - name: Verify Apktool rebuild and DEX insertion
        run: |
          set -euo pipefail
          java -jar tools/apktool.jar b build/decoded -o build/SpaceL-unsigned.apk
          python3 scripts/patch.py --apk build/SpaceL-unsigned.apk \
            --dex build/dex/classes.dex --output-apk build/SpaceL-validation.apk
          unzip -l build/SpaceL-validation.apk | grep -E 'classes[0-9]*\.dex'

      - name: Package source-only patch
        run: |
          set -euo pipefail
          mkdir -p dist/app
          cp -R app/src dist/app/
          cp app/README.md dist/app/README.md
          cp -R scripts dist/
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          cp README.md dist/
          cp build/dex/classes.dex dist/SpaceL_Menu.dex
          cp build/APK_Analysis_Report.md dist/
          cd dist
          zip -qr ../SpaceL_Source_Patch.zip .

      - name: Upload source patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceL-Source-Patch
          path: SpaceL_Source_Patch.zip
          if-no-files-found: error
          retention-days: 14
